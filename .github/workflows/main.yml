
name: Build Mario Terror

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Find and build mod
        shell: bash
        run: |
          echo "Buscando build.gradle..."
          BUILD_FILE=$(find . -name build.gradle -not -path '*/.gradle/*' -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: No se encontró build.gradle"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          MOD_DIR=$(dirname "$BUILD_FILE")
          echo "Proyecto encontrado en: $MOD_DIR"
          cd "$MOD_DIR"
          gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Mario-Terror-Mod
          path: '**/build/libs/*.jar'
          if-no-files-found: error
